services:
  app:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: sleep infinity
    environment:
      DATABASE_URL: mysql://spendual:spendual@mysql:3306/spendual
      TZ: America/Sao_Paulo
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - "5173:5173"
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spendual
      MYSQL_USER: spendual
      MYSQL_PASSWORD: spendual
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  node_modules:
  mysql_data:
