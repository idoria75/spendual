services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: sleep infinity
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: mysql://spendual:spendual@mysql:3306/spendual
      SESSION_SECRET: dev-only-secret-change-for-real-use-0123456789
      TZ: America/Sao_Paulo
      HOME: /tmp
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spendual
      MYSQL_USER: spendual
      MYSQL_PASSWORD: spendual
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
